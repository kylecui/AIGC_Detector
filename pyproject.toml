[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aigc-detector"
version = "0.1.0"
description = "Bilingual (Chinese+English) AI-generated text detection system"
requires-python = ">=3.12"
dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "slowapi>=0.1.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # ML Core
    "transformers>=4.40",
    "tokenizers>=0.19",
    "datasets>=2.18",
    "accelerate>=0.28",
    "peft>=0.10",
    "bitsandbytes>=0.43",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
    "huggingface_hub>=0.23",
    "hf-transfer>=0.1.6", # Rust-backed multi-connection downloader for HF Hub
    # PyTorch (via CUDA index)
    "torch>=2.2",
    "torchvision>=0.17",
    # Data
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "nltk>=3.8",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "xgboost>=2.0",
    # Utilities
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "tqdm>=4.66",
    "protobuf>=7.34.0",
    "paramiko>=4.0.0",
    "pypdf>=6.9.0",
    "pymupdf>=1.27.2.3",
    "python-multipart>=0.0.32",
    "python-docx>=1.2.0",
    "matplotlib>=3.11.1",
]

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[project.scripts]
aigc-detector = "aigc_detector.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aigc_detector"]

[tool.hatch.build.targets.wheel.force-include]
"static" = "aigc_detector/static"
"configs" = "aigc_detector/configs"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124" },
]
torchvision = [
    { index = "pytorch-cu124" },
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
