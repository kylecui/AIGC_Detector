_doc: 'ZH formal-register lexical gate (W3a/W3b). Calibrated on FN-1 fixture + 62-doc
  human probe (7/7 formal hit, casual 0误伤). Editing this file changes gate behavior:
  run tests/test_register_gate.py + probe coverage anchors.'
threshold: 6
markers:
  特此声明: 3
  特此承诺: 3
  特此公告: 3
  特此函告: 3
  特此通知: 3
  严正声明: 3
  郑重承诺: 3
  兹因: 2
  兹就: 2
  兹有: 2
  现声明如下: 3
  现承诺如下: 3
  现公告如下: 3
  现就有关事项公告如下: 3
  声明如下: 2
  承诺如下: 2
  公告如下: 2
  依据《: 2
  根据《中华人民共和国: 2
  如有违反: 2
  承担相应责任: 2
  承担法律责任: 2
  严格遵守: 1
  致：: 2
  保证信息披露: 3
  真实、准确、完整: 2
  公司及董事会: 2
  通报如下: 3
  现将有关情况: 2
  说明如下: 2
structure:
- pattern: 《关于.{2,24}的(声明|公告|承诺书|情况说明|函|通知书?|澄清公告)》,?
  weight: 3
  min_hits: 1
- pattern: ＿{2,}\s*年\s*＿{2,}\s*月\s*＿{2,}\s*日
  weight: 3
  min_hits: 1
- pattern: (?m)^\s*[一二三四五六七八九十]{1,3}、
  weight: 2
  min_hits: 2
- pattern: (?m)^＿{4,}\s*$
  weight: 2
  min_hits: 1
- pattern: (?m)^\d{4}\s*年\s*\d{1,2}\s*月\s*\d{1,2}\s*日\s*$
  weight: 2
  min_hits: 1
