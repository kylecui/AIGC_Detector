# DetectionPlan: default — the shipped deployment (v0.2a).
# Expresses EXACTLY the assembly that api/main.py lifespan and
# evaluate_paired_experiment.build_pipeline hand-coded before unification.
# Any change here is a deployment change: run probes + verify gate.
plan: default@0.2a

language:
  router: papluca/xlm-roberta-base-language-detection

statistical:
  load_in_4bit: false
  languages:
    en: { extractor: openai-community/gpt2-xl }
    zh: { extractor: IDEA-CCNL/Wenzhong-GPT2-110M }

encoder:
  languages:
    en: { base: microsoft/deberta-v3-large, adapter: encoder-en }
    zh: { base: hfl/chinese-roberta-wwm-ext-large, adapter: encoder-zh }

binoculars:
  mode: low-fpr
  load_in_4bit: true
  require_cached: true          # missing pairs go to background download (API only)
  pairs:
    en: { observer: tiiuae/falcon-7b, performer: tiiuae/falcon-7b-instruct }
    zh: { observer: Qwen/Qwen2-7B, performer: Qwen/Qwen2-7B-Instruct }

# Language-level ensemble weights (validated 2026-06-17/19; see DETECTOR_NOTES_2026-06.md):
#   EN — encoder LoRA underperforms on modern multi-LLM text; linguistic is primary
#        (sweep: scripts/tune_en_detector.py).
#   ZH — encoder retrained with 10x textbook oversampling; statistical kept as
#        minor signal (HC3 overfit documented).
weights:
  en: { linguistic: 0.85, statistical: 0.15, encoder: 0.0, binoculars: 0.0 }
  zh: { linguistic: 0.10, statistical: 0.10, encoder: 0.60, binoculars: 0.20 }

early_exit_threshold: 0.99      # raised from 0.95 — was too aggressive for modern LLM text

# Decision policies (v0.2b): register-conditional behaviors, artifact-driven.
# Each entry names the artifact that owns its parameters — editing the
# artifact changes behavior; probes + verify gate must run.
policy:
  - id: formal_zh_floor            # W15 OR-rule: flag if ensemble>=thr OR binoculars>=cutoff
    when: register(formal_zh)      # gate lexicon: configs/gates/formal_zh.yaml
    artifact: models/calibration/binoculars_floor.json   # {enabled, cutoff: 0.46}
    provenance_field: decision_rule
  - id: formal_zh_calibrate        # W11 register-conditioned temperature
    when: register(formal_zh)
    artifact: models/calibration/global_temperature.json # {T: 5.645, applied}
    provenance_field: calibration
  - id: formal_en_downgrade        # W16: cap confidence below threshold + warning
    when: register(formal_en)      # gate lexicon: configs/gates/formal_en.yaml (+disabled ML layer)
    artifact: models/calibration/en_register_gate.json   # {downgrade_confidence_cap: 0.49}
    provenance_field: caveat
pins: models/calibration/model_pins.json   # verify gate enforces runtime models ⊆ pins

# Probes (v0.2c): declared acceptance assertions, run via scripts/run_probes.py.
# Each probe is a deployment-behavior contract; a FAIL here blocks release.
probes:
  - id: fn1-known-bad
    requires: gpu
    fixture: tests/fixtures/fn1_declaration.txt
    asserts:
      verdict: Human-written            # the honest boundary: edited AI text
      max_segment_p_ai_gte: 0.8         # segment evidence must surface
  - id: zh-formal-gate-coverage
    requires: cpu
    dataset: dataset/legal_declaration_zh/human
    expects: {files_gte: 20, formal_hit_subset_gte: 7}   # EXPECTED_FORMAL 7-doc anchor
  - id: en-formal-gate-coverage
    requires: cpu
    dataset: dataset/legal_declaration_en/human
    expects: {files_gte: 20, lexical_hit_gte: 8, lexical_hit_lte: 14}
